[project]
name = "nexusssd-backend"
version = "0.1.0"
description = "NexusSSD — Agentic AI Fleet Health Copilot backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
]
# Cloud LLM/embeddings provider (light).
ai = [
    "openai>=1.40",
]
# Optional local embedding model (heavy: pulls PyTorch). Not required — the
# built-in offline HashingEmbedder is the zero-dependency default.
local-embeddings = [
    "sentence-transformers>=3.0",
]
# LlamaIndex RAG backend, orchestrated over pgvector (used on PostgreSQL).
llamaindex = [
    "llama-index-core>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
]
# Multi-agent orchestration (Phase 5).
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# Observability (Phase 7).
monitoring = [
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
